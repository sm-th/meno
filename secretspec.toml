[project]
name = "researcher"
revision = "1.0"

[profiles.default]
# Embeddings via OpenRouter (/v1/embeddings), model qwen/qwen3-embedding-8b.
OPENROUTER_API_KEY = { description = "OpenRouter API key (embeddings)", required = true }

# Managed Qdrant Cloud: vector store for corpus embeddings + evidence.
QDRANT_URL     = { description = "Qdrant Cloud cluster base URL (https://...)", required = true }
QDRANT_API_KEY = { description = "Qdrant Cloud API key", required = true }

# omp (Claude) auth: `claude setup-token` OAuth value. omp resolves Anthropic
# auth as ANTHROPIC_OAUTH_TOKEN -> ANTHROPIC_API_KEY. Used by planner + worker.
ANTHROPIC_OAUTH_TOKEN = { description = "Claude setup-token (OAuth) for omp", required = true }
