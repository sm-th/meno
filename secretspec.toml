[project]
name = "researcher"
revision = "1.0"

[profiles.default]
# ── Embeddings: OpenRouter /v1/embeddings, model qwen/qwen3-embedding-8b ──
OPENROUTER_API_KEY = { description = "OpenRouter API key (embeddings)", required = true }

# ── Vector store: managed Qdrant Cloud (corpus embeddings + evidence) ──
QDRANT_URL     = { description = "Qdrant Cloud cluster base URL (https://...)", required = true }
QDRANT_API_KEY = { description = "Qdrant Cloud API key", required = true }

# ── Reasoning: omp/Claude (Sonnet). `claude setup-token` OAuth value.
#    omp resolves Anthropic auth as ANTHROPIC_OAUTH_TOKEN -> ANTHROPIC_API_KEY. ──
ANTHROPIC_OAUTH_TOKEN = { description = "Claude setup-token (OAuth) for omp", required = true }

# ── GitHub: bot PAT. Read of blog/wiki is public (no auth); this is for WRITE:
#    create issues, push branches, open PRs on smith-wiki. Also read by `gh`. ──
GH_TOKEN = { description = "Bot GitHub PAT (issues + contents + PR on smith-wiki)", required = true }

# ── GitHub Projects v2 (the approval board). SEPARATE token on purpose:
#    fine-grained PATs DO NOT expose a Projects permission for USER-owned
#    Projects v2 (only org-owned). So a CLASSIC PAT with the `project` scope is
#    required — kept separate (project scope only, no repo) so this broad-ish
#    classic token can't touch code. See docs/auth.md. ──
GH_PROJECTS_TOKEN = { description = "Classic PAT, `project` scope only, for Projects v2 GraphQL", required = true }

# ── Linkwarden (cloud): the reading-feed / reference sink for worker findings ──
LINKWARDEN_URL   = { description = "Linkwarden instance base URL (https://...)", required = true }
LINKWARDEN_TOKEN = { description = "Linkwarden API access token", required = true }

# ── Web search: Tavily (free 1000/mo, agent-optimized). Free signup key. ──
TAVILY_API_KEY = { description = "Tavily search API key (free tier)", required = true }
